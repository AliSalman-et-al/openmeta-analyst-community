name: Modern Package

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build the modern Windows artifact.
        required: true
        default: true
        type: boolean
      build_macos:
        description: Build the opt-in modern macOS Intel artifact.
        required: true
        default: false
        type: boolean
      build_macos_arm64:
        description: Also attempt the experimental Apple Silicon macOS artifact.
        required: true
        default: false
        type: boolean
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - ".github/workflows/modern-package.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build-modern-windows-binary.ps1"
      - "scripts/build-modern-macos-binary.sh"
      - "scripts/package-modern-windows.ps1"
      - "scripts/package-modern-macos.sh"
      - "scripts/install-modern-r-deps.R"
      - "scripts/verify_openmetar_r_stack.py"
      - "src/R/**"
      - "src/launch.py"
      - "sample_data/**"
      - "doc/**"
  pull_request:
    paths:
      - ".github/workflows/modern-package.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/build-modern-windows-binary.ps1"
      - "scripts/build-modern-macos-binary.sh"
      - "scripts/package-modern-windows.ps1"
      - "scripts/package-modern-macos.sh"
      - "scripts/install-modern-r-deps.R"
      - "scripts/verify_openmetar_r_stack.py"
      - "src/R/**"
      - "src/launch.py"
      - "sample_data/**"
      - "doc/**"

permissions:
  contents: read

concurrency:
  group: modern-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Windows Packaging Lane
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Set up R for bundled runtime
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Cache bundled R package library
        uses: actions/cache@v5
        with:
          path: artifacts\r-library-cache
          key: modern-r-library-windows-${{ hashFiles('scripts/install-modern-r-deps.R', 'docs/modernization/OpenMetaR-r-dependencies.json', 'src/R/OpenMetaR/DESCRIPTION') }}
          restore-keys: |
            modern-r-library-windows-

      - name: Build modern Windows package
        run: .\scripts\package-modern-windows.ps1 -ArtifactName OpenMetaAnalyst-modern-windows-x64

      - name: Upload modern Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMetaAnalyst-modern-windows-x64
          path: artifacts\OpenMetaAnalyst-modern-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Windows packaging diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenMetaAnalyst-modern-windows-x64-diagnostics
          path: |
            build\modern-windows\work\OpenMetaAnalyst\warn-OpenMetaAnalyst.txt
            build\modern-windows\work\OpenMetaAnalyst\xref-OpenMetaAnalyst.html
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  macos-package-intel:
    name: macOS Packaging Lane (Intel)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    runs-on: macos-15-intel
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Set up R for bundled runtime
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Cache bundled R package library
        uses: actions/cache@v5
        with:
          path: artifacts/r-library-cache
          key: modern-r-library-macos-x64-${{ hashFiles('scripts/install-modern-r-deps.R', 'docs/modernization/OpenMetaR-r-dependencies.json', 'src/R/OpenMetaR/DESCRIPTION') }}
          restore-keys: |
            modern-r-library-macos-x64-

      - name: Build modern macOS package
        run: bash scripts/package-modern-macos.sh --architecture x64 --artifact-name OpenMetaAnalyst-modern-macos-x64

      - name: Upload modern macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMetaAnalyst-modern-macos-x64
          path: artifacts/OpenMetaAnalyst-modern-macos-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload macOS Intel packaging diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenMetaAnalyst-modern-macos-x64-diagnostics
          path: |
            build/modern-macos/x64/work/OpenMetaAnalyst/warn-OpenMetaAnalyst.txt
            build/modern-macos/x64/work/OpenMetaAnalyst/xref-OpenMetaAnalyst.html
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  macos-package-arm64:
    name: macOS Packaging Lane (Apple Silicon)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos_arm64 }}
    runs-on: macos-14
    continue-on-error: true
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Set up R for bundled runtime
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Cache bundled R package library
        uses: actions/cache@v5
        with:
          path: artifacts/r-library-cache
          key: modern-r-library-macos-arm64-${{ hashFiles('scripts/install-modern-r-deps.R', 'docs/modernization/OpenMetaR-r-dependencies.json', 'src/R/OpenMetaR/DESCRIPTION') }}
          restore-keys: |
            modern-r-library-macos-arm64-

      - name: Explain current Apple Silicon dependency limitation
        run: |
          echo "Apple Silicon packaging is experimental."
          echo "The shared lock currently pins PyQt5-Qt5==5.15.2, which has no macOS arm64 wheel."

      - name: Build modern macOS package
        run: bash scripts/package-modern-macos.sh --architecture arm64 --artifact-name OpenMetaAnalyst-modern-macos-arm64

      - name: Upload modern macOS binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMetaAnalyst-modern-macos-arm64
          path: artifacts/OpenMetaAnalyst-modern-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload macOS Apple Silicon packaging diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenMetaAnalyst-modern-macos-arm64-diagnostics
          path: |
            build/modern-macos/arm64/work/OpenMetaAnalyst/warn-OpenMetaAnalyst.txt
            build/modern-macos/arm64/work/OpenMetaAnalyst/xref-OpenMetaAnalyst.html
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
