name: Modern Package

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Build the modern Windows artifact.
        required: true
        default: true
        type: boolean
      build_macos:
        description: Build the opt-in modern macOS Intel artifact.
        required: true
        default: false
        type: boolean
      build_macos_arm64:
        description: Also attempt the experimental Apple Silicon macOS artifact.
        required: true
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RCMS_CRAN_REPO: https://cloud.r-project.org
  RCMS_CRAN_REPO_KEY: cloud-r-project-org

concurrency:
  group: modern-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: Windows Packaging Lane
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Set up R for bundled runtime
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Resolve R cache version
        id: r-cache-key
        run: |
          $version = Rscript -e "cat(paste0('R-', getRversion()))"
          $runtimeRoot = Rscript -e "cat(normalizePath(R.home(), winslash='/', mustWork=TRUE))"
          "version=$version" >> $env:GITHUB_OUTPUT
          "runtime-root=$runtimeRoot" >> $env:GITHUB_OUTPUT

      - name: Cache bundled R package library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts\r-library-cache
          key: modern-bundled-r-library-v2-windows-${{ steps.r-cache-key.outputs.version }}-${{ env.RCMS_CRAN_REPO_KEY }}-${{ hashFiles('scripts/install-modern-r-deps.R', 'docs/modernization/RCMetaR-r-dependencies.json', 'r/RCMetaR/DESCRIPTION') }}

      - name: Build modern Windows package
        run: .\scripts\package-modern-windows.ps1 -ArtifactName RCMetaStudio-modern-windows-x64 -RRuntimeRoot "${{ steps.r-cache-key.outputs.runtime-root }}"

      - name: Upload modern Windows binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RCMetaStudio-modern-windows-x64
          path: artifacts\RCMetaStudio-modern-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload Windows packaging diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RCMetaStudio-modern-windows-x64-diagnostics
          path: |
            build\modern-windows\work\RCMetaStudio\warn-RCMetaStudio.txt
            build\modern-windows\work\RCMetaStudio\xref-RCMetaStudio.html
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  macos-package-intel:
    name: macOS Packaging Lane (Intel)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Set up R for bundled runtime
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Resolve R cache version
        id: r-cache-key
        run: |
          version="$(Rscript -e "cat(paste0('R-', getRversion()))")"
          runtime_root="$(Rscript -e "cat(normalizePath(R.home(), winslash='/', mustWork=TRUE))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "runtime-root=$runtime_root" >> "$GITHUB_OUTPUT"

      - name: Cache bundled R package library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/r-library-cache
          key: modern-bundled-r-library-v2-macos-x64-${{ steps.r-cache-key.outputs.version }}-${{ env.RCMS_CRAN_REPO_KEY }}-${{ hashFiles('scripts/install-modern-r-deps.R', 'docs/modernization/RCMetaR-r-dependencies.json', 'r/RCMetaR/DESCRIPTION') }}

      - name: Build modern macOS package
        run: bash scripts/package-modern-macos.sh --architecture x64 --artifact-name RCMetaStudio-modern-macos-x64 --r-runtime-root "${{ steps.r-cache-key.outputs.runtime-root }}"

      - name: Upload modern macOS binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RCMetaStudio-modern-macos-x64
          path: artifacts/RCMetaStudio-modern-macos-x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload macOS Intel packaging diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RCMetaStudio-modern-macos-x64-diagnostics
          path: |
            build/modern-macos/x64/work/RCMetaStudio/warn-RCMetaStudio.txt
            build/modern-macos/x64/work/RCMetaStudio/xref-RCMetaStudio.html
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0

  macos-package-arm64:
    name: macOS Packaging Lane (Apple Silicon)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_macos_arm64 }}
    runs-on: macos-14
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Set up R for bundled runtime
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Resolve R cache version
        id: r-cache-key
        run: |
          version="$(Rscript -e "cat(paste0('R-', getRversion()))")"
          runtime_root="$(Rscript -e "cat(normalizePath(R.home(), winslash='/', mustWork=TRUE))")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "runtime-root=$runtime_root" >> "$GITHUB_OUTPUT"

      - name: Cache bundled R package library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/r-library-cache
          key: modern-bundled-r-library-v2-macos-arm64-${{ steps.r-cache-key.outputs.version }}-${{ env.RCMS_CRAN_REPO_KEY }}-${{ hashFiles('scripts/install-modern-r-deps.R', 'docs/modernization/RCMetaR-r-dependencies.json', 'r/RCMetaR/DESCRIPTION') }}

      - name: Explain current Apple Silicon dependency limitation
        run: |
          echo "Apple Silicon packaging is experimental."
          echo "The shared lock currently pins PyQt5-Qt5==5.15.2, which has no macOS arm64 wheel."

      - name: Build modern macOS package
        run: bash scripts/package-modern-macos.sh --architecture arm64 --artifact-name RCMetaStudio-modern-macos-arm64 --r-runtime-root "${{ steps.r-cache-key.outputs.runtime-root }}"

      - name: Upload modern macOS binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RCMetaStudio-modern-macos-arm64
          path: artifacts/RCMetaStudio-modern-macos-arm64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload macOS Apple Silicon packaging diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: RCMetaStudio-modern-macos-arm64-diagnostics
          path: |
            build/modern-macos/arm64/work/RCMetaStudio/warn-RCMetaStudio.txt
            build/modern-macos/arm64/work/RCMetaStudio/xref-RCMetaStudio.html
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
