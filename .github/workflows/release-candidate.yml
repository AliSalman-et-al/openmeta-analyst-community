name: Sign and Publish Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Build Immutable Candidate workflow run ID.
        required: true
        type: string
      version:
        description: RC version, for example 0.1.2-rc.1.
        required: true
        type: string
      source_sha:
        description: Exact candidate source SHA.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sign:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            artifact: RCMetaStudio-windows-x64.zip
            environment: windows-signing
          - target: macos-x64
            runner: macos-15-intel
            artifact: RCMetaStudio-macos-x64.zip
            environment: macos-signing
    runs-on: ${{ matrix.runner }}
    environment: ${{ matrix.environment }}
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          TARGET: ${{ matrix.target }}
        run: gh run download "$env:RUN_ID" --name "candidate-$env:TARGET" --dir candidate
        shell: pwsh
      - name: Assert trusted-signed profile
        shell: pwsh
        run: |
          $manifest = Get-ChildItem candidate -Recurse -Filter release-set.json | Select-Object -First 1
          if (-not $manifest) { throw "Initial release set is missing." }
          $profile = (Get-Content $manifest.FullName -Raw | ConvertFrom-Json).trust_profile
          if ($profile -ne 'trusted-signed') { throw "Candidate trust profile is $profile, expected trusted-signed." }
      - run: uv python install 3.11.9
      - name: Expand Windows candidate
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: Expand-Archive -LiteralPath candidate/artifacts/${{ matrix.artifact }} -DestinationPath signed/tree
      - name: Sign Windows candidate with Azure Artifact Signing
        if: matrix.target == 'windows-x64'
        uses: azure/trusted-signing-action@07c81171dd46a04e1b9f382b6c693815828bbbf7 # v0.5.0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: signed/tree
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify and archive Windows signed bytes
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: .\scripts\verify-archive-windows.ps1 -Tree signed/tree -Output signed/${{ matrix.artifact }}
      - name: Import ephemeral Apple signing identity
        if: matrix.target == 'macos-x64'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE_P12_BASE64"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_NOTARY_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" rcms-signing.keychain-db
          security set-keychain-settings -lut 21600 rcms-signing.keychain-db
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" rcms-signing.keychain-db
          security import "$RUNNER_TEMP/developer-id.p12" -k rcms-signing.keychain-db -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" rcms-signing.keychain-db
          security list-keychains -d user -s rcms-signing.keychain-db
      - name: Sign, notarize, staple, and archive macOS candidate
        if: matrix.target == 'macos-x64'
        shell: bash
        env:
          RCMS_APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          RCMS_APPLE_NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          RCMS_APPLE_NOTARY_ISSUER: ${{ vars.APPLE_NOTARY_ISSUER }}
          RCMS_APPLE_NOTARY_KEY_FILE: ${{ runner.temp }}/notary.p8
        run: bash scripts/sign-notarize-macos-package.sh candidate/artifacts/${{ matrix.artifact }} signed/${{ matrix.artifact }}
      - name: Clean Apple keychain
        if: always() && matrix.target == 'macos-x64'
        shell: bash
        run: security delete-keychain rcms-signing.keychain-db || true
      - name: Expand final signed Windows artifact
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: Expand-Archive -LiteralPath "signed/${{ matrix.artifact }}" -DestinationPath signed/final-tree
      - name: Expand final notarized macOS artifact
        if: matrix.target == 'macos-x64'
        shell: bash
        run: mkdir -p signed/final-tree && ditto -x -k "signed/${{ matrix.artifact }}" signed/final-tree
      - name: Regenerate packaged-tree evidence
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ inputs.version }}
        run: |
          uv run python scripts/delivery.py inventory --root signed/final-tree --output "signed/$env:TARGET.inventory.json"
          uv run python scripts/delivery.py sbom --inventory "signed/$env:TARGET.inventory.json" --version "$env:VERSION" --output "signed/$env:TARGET.cdx.json"
      - name: Launch exact signed Windows bytes
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed/final-tree -Recurse -Filter RCMetaStudio.exe | Select-Object -First 1
          if (-not $exe) { throw "Signed RCMetaStudio.exe is missing." }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:RCMS_REQUIRE_IN_PROCESS_RPY2 = "1"
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @("--automation-smoke") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Signed packaged smoke failed with exit code $($process.ExitCode)." }
      - name: Launch exact notarized macOS bytes
        if: matrix.target == 'macos-x64'
        shell: bash
        run: |
          set -euo pipefail
          executable="$(find signed/final-tree -path '*.app/Contents/MacOS/RCMetaStudio' -print -quit)"
          test -n "$executable"
          QT_QPA_PLATFORM=offscreen RCMS_REQUIRE_IN_PROCESS_RPY2=1 "$executable" --automation-smoke
      - name: Produce immutable signing stage chain
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          New-Item -ItemType Directory -Force signed/records | Out-Null
          $assembled = Get-ChildItem candidate -Recurse -Filter "$env:TARGET.assembled.json" | Select-Object -First 1
          if (-not $assembled) { throw "Missing assembled stage result." }
          Copy-Item -LiteralPath $assembled.FullName -Destination "signed/records/$env:TARGET.assembled.json"
          $input = uv run python scripts/delivery.py digest --json $assembled.FullName
          uv run python scripts/delivery.py stage-result --target "$env:TARGET" --stage signed --commit "$env:SOURCE_SHA" --input-digest "$input" --output-file "signed/$env:ARTIFACT" --result "signed/records/$env:TARGET.signed.json"
          $previous = "signed/records/$env:TARGET.signed.json"
          if ($env:TARGET -eq 'macos-x64') {
            $input = uv run python scripts/delivery.py digest --json $previous
            uv run python scripts/delivery.py stage-result --target "$env:TARGET" --stage notarized --commit "$env:SOURCE_SHA" --input-digest "$input" --output-file "signed/$env:ARTIFACT" --result "signed/records/$env:TARGET.notarized.json"
            $previous = "signed/records/$env:TARGET.notarized.json"
          }
          $input = uv run python scripts/delivery.py digest --json $previous
          uv run python scripts/delivery.py stage-result --target "$env:TARGET" --stage verified --commit "$env:SOURCE_SHA" --input-digest "$input" --output-file "signed/$env:ARTIFACT" --output-file "signed/$env:TARGET.inventory.json" --output-file "signed/$env:TARGET.cdx.json" --result "signed/records/$env:TARGET.verified.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ matrix.target }}
          path: signed
          if-no-files-found: error
          compression-level: 0

  attest:
    needs: sign
    strategy:
      matrix:
        include:
          - target: windows-x64
            artifact: RCMetaStudio-windows-x64.zip
          - target: macos-x64
            artifact: RCMetaStudio-macos-x64.zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-${{ matrix.target }}
          path: bundle
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: bundle/${{ matrix.artifact }}
      - uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: bundle/${{ matrix.artifact }}
          sbom-path: bundle/${{ matrix.target }}.cdx.json
      - name: Record attested stage
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          input="$(python scripts/delivery.py digest --json bundle/records/$TARGET.verified.json)"
          python scripts/delivery.py stage-result --target "$TARGET" --stage attested --commit "$SOURCE_SHA" --input-digest "$input" --output-file "bundle/$ARTIFACT" --output-file "bundle/$TARGET.cdx.json" --result "bundle/records/$TARGET.attested.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attested-${{ matrix.target }}
          path: bundle
          compression-level: 0

  publish-rc:
    needs: attest
    runs-on: ubuntu-latest
    environment: release-candidate
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download initial manifest and final targets
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --name release-set-initial --dir release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: attested-*
          path: release/targets
      - name: Assemble and verify release set
        run: |
          set -euo pipefail
          manifest=release/release-set.json
          for target in windows-x64 macos-x64; do
            root="release/targets/attested-$target"
            python scripts/delivery.py attach --manifest "$manifest" --result "$root/records/$target.assembled.json"
            python scripts/delivery.py attach --manifest "$manifest" --result "$root/records/$target.signed.json"
            if [ "$target" = macos-x64 ]; then python scripts/delivery.py attach --manifest "$manifest" --result "$root/records/$target.notarized.json"; fi
            python scripts/delivery.py attach --manifest "$manifest" --result "$root/records/$target.verified.json"
            python scripts/delivery.py attach --manifest "$manifest" --result "$root/records/$target.attested.json"
          done
          python scripts/delivery.py verify --manifest "$manifest"
          python scripts/delivery.py promote --manifest "$manifest" --from-channel candidate --channel rc --output release/release-set-rc.json
          cp release/targets/attested-windows-x64/RCMetaStudio-windows-x64.zip release/
          cp release/targets/attested-macos-x64/RCMetaStudio-macos-x64.zip release/
          cp release/targets/attested-windows-x64/windows-x64.cdx.json release/
          cp release/targets/attested-macos-x64/macos-x64.cdx.json release/
          python scripts/delivery.py checksums --files release/RCMetaStudio-windows-x64.zip --files release/RCMetaStudio-macos-x64.zip --files release/windows-x64.cdx.json --files release/macos-x64.cdx.json --output release/SHA256SUMS
      - name: Publish immutable RC
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; refusing overwrite." >&2; exit 1; fi
          git tag -a "$TAG" "${{ inputs.source_sha }}" -m "RC MetaStudio ${{ inputs.version }}"
          git push origin "$TAG"
          gh release create "$TAG" release/RCMetaStudio-*.zip release/*.cdx.json release/SHA256SUMS release/release-set-rc.json --prerelease --verify-tag --title "RC MetaStudio ${{ inputs.version }}" --notes "Immutable signed release candidate. Verify SHA256SUMS and GitHub artifact attestations before promotion."
