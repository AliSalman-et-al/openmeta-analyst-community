name: Package macOS Intel x64

on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string

permissions:
  contents: read

env:
  RCMS_CRAN_REPO: https://packagemanager.posit.co/cran/2026-07-16

jobs:
  package:
    name: ${{ inputs.artifact_name }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked Python
        run: uv python install 3.11.9

      - name: Resolve package metadata
        id: package-metadata
        shell: bash
        run: uv run --no-project --python 3.11.9 python scripts/resolve_package_ci_metadata.py --version-only

      - name: Cache official Qt SDK on macOS
        id: macos_qt_sdk_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/qt-sdk
          key: qt-sdk-6.11.1-macos-x64

      - name: Install official Qt SDK on macOS
        if: ${{ steps.macos_qt_sdk_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: uv tool run --from aqtinstall==3.3.0 aqt install-qt mac desktop 6.11.1 clang_64 --outputdir "$PWD/build/qt-sdk"

      - name: Resolve official Qt rcc on macOS
        shell: bash
        run: PYTHONPATH="$PWD/src" uv run --no-project --python 3.11.9 python scripts/qt6_macos_feasibility.py resolve-rcc --sdk-root "$PWD/build/qt-sdk/6.11.1/macos" --github-env "$GITHUB_ENV" --diagnostic "build/qt-sdk/macos-x64-rcc.json"

      - name: Build, inspect, smoke, archive, and requalify macOS Intel package
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test ! -e /opt/X11
          bash scripts/package-macos.sh --architecture x64 \
            --artifact-name "${{ inputs.artifact_name }}" \
            --archive-root-name "RCMetaStudio-${{ steps.package-metadata.outputs.version }}-macos-x64"

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/${{ inputs.artifact_name }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload qualification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_name }}-evidence
          path: |
            artifacts/${{ inputs.artifact_name }}-evidence.json
            artifacts/${{ inputs.artifact_name }}-archive-inspection.json
            build/macos-package/x64/work/qualification/**
            build/macos-package/x64/work/qualification/packaged-smoke*.log
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.artifact_name }}-diagnostics
          path: |
            build/macos-package/x64/work/RCMetaStudio/warn-RCMetaStudio.txt
            build/macos-package/x64/work/RCMetaStudio/xref-RCMetaStudio.html
            build/macos-package/x64/work/qualification/**
            artifacts/*-archive-inspection.json
            artifacts/*-evidence.json
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 0
