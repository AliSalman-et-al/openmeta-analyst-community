name: Publish Unsigned Community Release Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful unsigned-community candidate workflow run ID.
        required: true
        type: string
      version:
        description: RC version, for example 0.2.0-rc.1.
        required: true
        type: string
      source_sha:
        description: Exact candidate source SHA.
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            artifact: RCMetaStudio-windows-x64.zip
          - target: macos-arm64
            runner: macos-15
            artifact: RCMetaStudio-macos-arm64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          TARGET: ${{ matrix.target }}
        shell: pwsh
        run: gh run download "$env:RUN_ID" --name "candidate-$env:TARGET" --dir candidate
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv python install 3.11.9
      - name: Assert unsigned-community profile
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $manifest = Get-ChildItem candidate -Recurse -Filter release-set.json | Select-Object -First 1
          if (-not $manifest) { throw "Initial release set is missing." }
          $releaseSet = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          if ($releaseSet.trust_profile -ne 'unsigned-community') { throw "Candidate trust profile is $($releaseSet.trust_profile), expected unsigned-community." }
          if ($releaseSet.version -ne $env:EXPECTED_VERSION) { throw "Candidate version is $($releaseSet.version), expected $env:EXPECTED_VERSION." }
          if ($releaseSet.source.commit -ne $env:EXPECTED_SOURCE_SHA) { throw "Candidate source is $($releaseSet.source.commit), expected $env:EXPECTED_SOURCE_SHA." }
          if (($releaseSet.release_targets -join ',') -ne 'windows-x64,macos-arm64') { throw "Candidate release targets must contain exactly Windows x64 and Apple silicon macOS." }
      - name: Expand unsigned Windows artifact
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: Expand-Archive -LiteralPath candidate/artifacts/${{ matrix.artifact }} -DestinationPath qualified/tree
      - name: Launch exact unsigned Windows bytes
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          $exe = Get-ChildItem qualified/tree -Recurse -Filter RCMetaStudio.exe | Select-Object -First 1
          $sample = Get-ChildItem qualified/tree -Recurse -Filter amino.rcms | Select-Object -First 1
          $runtimeProbe = Get-ChildItem qualified/tree -Recurse -Filter runtime-probe.json | Select-Object -First 1
          if (-not $exe) { throw "RCMetaStudio.exe is missing." }
          if (-not $sample) { throw "amino.rcms is missing." }
          if (-not $runtimeProbe) { throw "runtime-probe.json is missing." }
          New-Item -ItemType Directory -Force qualified/diagnostics | Out-Null
          $env:RCMS_REQUIRE_IN_PROCESS_RPY2 = "1"
          $env:RPY2_CFFI_MODE = "API"
          $env:QT_SCALE_FACTOR = "1.25"
          $env:RCMS_PACKAGE_BASELINE_DPR = (Get-Content $runtimeProbe.FullName -Raw | ConvertFrom-Json).qt.baseline_device_pixel_ratio
          $env:RCMS_PACKAGE_SMOKE_EVIDENCE = (Resolve-Path qualified/diagnostics).Path + "\packaged-smoke.json"
          $env:RCMS_AUTOMATION_SMOKE_LOG = (Resolve-Path qualified/diagnostics).Path + "\packaged-smoke.log"
          $env:RCMS_AUTOMATION_HANG_TRACE = (Resolve-Path qualified/diagnostics).Path + "\packaged-smoke.hang-trace.log"
          Remove-Item Env:\QT_QPA_PLATFORM -ErrorAction SilentlyContinue
          $quotedSample = '"{0}"' -f $sample.FullName
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @("--automation-native-smoke", $quotedSample) -PassThru -Wait -WindowStyle Hidden -RedirectStandardOutput qualified/diagnostics/packaged-smoke.stdout.log -RedirectStandardError qualified/diagnostics/packaged-smoke.stderr.log
          if ($process.ExitCode -ne 0) { throw "Unsigned packaged smoke failed with exit code $($process.ExitCode)." }
          $evidence = Get-Content $env:RCMS_PACKAGE_SMOKE_EVIDENCE -Raw | ConvertFrom-Json
          if ($evidence.passed -ne $true) { throw "Unsigned packaged smoke did not produce passing evidence." }
      - name: Expand unsigned native macOS artifact
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: mkdir -p qualified/tree && ditto -x -k "candidate/artifacts/${{ matrix.artifact }}" qualified/tree
      - name: Launch exact unsigned native macOS bytes
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: |
          set -euo pipefail
          app="$(find qualified/tree -type d -name 'RCMetaStudio.app' -print -quit)"
          app="$PWD/$app"
          executable="$app/Contents/MacOS/RCMetaStudio"
          sample="$(find qualified/tree -path '*/sample_projects/BCG.rcms' -print -quit)"
          runtime_probe="$(find qualified/tree -path '*/qualification/runtime-probe.json' -print -quit)"
          test -n "$app" && test -x "$executable" && test -n "$sample" && test -n "$runtime_probe"
          sample="$PWD/$sample"
          runtime_probe="$PWD/$runtime_probe"
          baseline_dpr="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["qt"]["baseline_device_pixel_ratio"])' "$runtime_probe")"
          mkdir -p qualified/diagnostics
          QT_SCALE_FACTOR=1.25 \
            RCMS_PACKAGE_BASELINE_DPR="$baseline_dpr" \
            RCMS_PACKAGE_SMOKE_EVIDENCE="$PWD/qualified/diagnostics/packaged-smoke.json" \
            RCMS_AUTOMATION_SMOKE_LOG="$PWD/qualified/diagnostics/packaged-smoke.log" \
            RCMS_AUTOMATION_HANG_TRACE="$PWD/qualified/diagnostics/packaged-smoke.hang-trace.log" \
            env -u QT_QPA_PLATFORM RCMS_REQUIRE_IN_PROCESS_RPY2=1 RPY2_CFFI_MODE=API \
              RCMS_R_HOME="$app/Contents/Frameworks/R.framework/Resources" \
              RCMS_R_LIBS="$app/Contents/Frameworks/R.framework/Resources/library" \
              uv run python scripts/run_bounded_process.py --timeout-seconds 900 \
                --stdout qualified/diagnostics/packaged-smoke.stdout.log \
                --stderr qualified/diagnostics/packaged-smoke.stderr.log \
                --completion-log qualified/diagnostics/packaged-smoke.log -- \
                "$executable" --automation-native-smoke "$sample"
          python3 -c 'import json,sys; evidence=json.load(open(sys.argv[1])); assert evidence.get("passed") is True' qualified/diagnostics/packaged-smoke.json
      - name: Upload RC qualification diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rc-qualification-${{ matrix.target }}-diagnostics
          path: qualified/diagnostics
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
      - name: Record unsigned qualification and final evidence
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force qualified/records | Out-Null
          Copy-Item "candidate/artifacts/$env:ARTIFACT" "qualified/$env:ARTIFACT"
          $assembled = Get-ChildItem candidate -Recurse -Filter "$env:TARGET.assembled.json" | Select-Object -First 1
          if (-not $assembled) { throw "Missing assembled stage result." }
          Copy-Item $assembled.FullName "qualified/records/$env:TARGET.assembled.json"
          uv run python scripts/delivery.py inventory --root qualified/tree --output "qualified/$env:TARGET.inventory.json"
          uv run python scripts/delivery.py sbom --inventory "qualified/$env:TARGET.inventory.json" --version "$env:VERSION" --output "qualified/$env:TARGET.cdx.json"
          $input = uv run python scripts/delivery.py digest --json $assembled.FullName
          uv run python scripts/delivery.py stage-result --target "$env:TARGET" --stage unsigned-qualified --commit "$env:SOURCE_SHA" --input-digest "$input" --output-file "qualified/$env:ARTIFACT" --result "qualified/records/$env:TARGET.unsigned-qualified.json"
          $input = uv run python scripts/delivery.py digest --json "qualified/records/$env:TARGET.unsigned-qualified.json"
          uv run python scripts/delivery.py stage-result --target "$env:TARGET" --stage verified --commit "$env:SOURCE_SHA" --input-digest "$input" --output-file "qualified/$env:ARTIFACT" --output-file "qualified/$env:TARGET.inventory.json" --output-file "qualified/$env:TARGET.cdx.json" --result "qualified/records/$env:TARGET.verified.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-${{ matrix.target }}
          path: qualified
          compression-level: 0

  attest:
    needs: qualify
    strategy:
      matrix:
        include:
          - target: windows-x64
            artifact: RCMetaStudio-windows-x64.zip
          - target: macos-arm64
            artifact: RCMetaStudio-macos-arm64.zip
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: qualified-${{ matrix.target }}
          path: bundle
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: bundle/${{ matrix.artifact }}
      - uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: bundle/${{ matrix.artifact }}
          sbom-path: bundle/${{ matrix.target }}.cdx.json
      - name: Record attested stage
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          input="$(python scripts/delivery.py digest --json bundle/records/$TARGET.verified.json)"
          python scripts/delivery.py stage-result --target "$TARGET" --stage attested --commit "$SOURCE_SHA" --input-digest "$input" --output-file "bundle/$ARTIFACT" --output-file "bundle/$TARGET.cdx.json" --result "bundle/records/$TARGET.attested.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: community-${{ matrix.target }}
          path: bundle
          compression-level: 0

  publish-rc:
    needs: attest
    runs-on: ubuntu-latest
    environment: release-candidate
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
      - name: Download initial manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: gh run download "$RUN_ID" --name release-set-initial --dir release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: community-*
          path: release/targets
      - name: Assemble unsigned community release set
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          manifest=release/release-set.json
          test "$(jq -r .trust_profile "$manifest")" = unsigned-community
          test "$(jq -r .version "$manifest")" = "$EXPECTED_VERSION"
          test "$(jq -r .source.commit "$manifest")" = "$EXPECTED_SOURCE_SHA"
          test "$(jq -c .release_targets "$manifest")" = '["windows-x64","macos-arm64"]'
          for target in windows-x64 macos-arm64; do
            root="release/targets/community-$target"
            for stage in assembled unsigned-qualified verified attested; do
              python scripts/delivery.py attach --manifest "$manifest" --result "$root/records/$target.$stage.json"
            done
          done
          python scripts/delivery.py verify --manifest "$manifest"
          python scripts/delivery.py promote --manifest "$manifest" --from-channel candidate --channel rc --output release/release-set-rc.json
          for target in windows-x64 macos-arm64; do
            root="release/targets/community-$target"
            cp "$root/RCMetaStudio-$target.zip" release/
            cp "$root/$target.cdx.json" release/
          done
          python scripts/delivery.py checksums --files release/RCMetaStudio-windows-x64.zip --files release/RCMetaStudio-macos-arm64.zip --files release/windows-x64.cdx.json --files release/macos-arm64.cdx.json --output release/SHA256SUMS
      - name: Publish clearly labeled immutable unsigned RC
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; refusing overwrite." >&2; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            test "$(git rev-list -n 1 "$TAG")" = "${{ inputs.source_sha }}"
            tag_args=(--verify-tag)
          else
            tag_args=(--target "${{ inputs.source_sha }}")
          fi
          gh release create "$TAG" release/RCMetaStudio-*.zip release/*.cdx.json release/SHA256SUMS release/release-set-rc.json "${tag_args[@]}" --prerelease --title "RC MetaStudio ${{ inputs.version }}" --notes $'**Signing status:** Unsigned community builds.\n\nWindows x64 and Apple silicon macOS artifacts were built once on native runners, package-smoke tested, SBOM inventoried, checksummed, and provenance-attested. The immutable unsigned artifacts are suitable inputs for a future no-rebuild signing stage.'
