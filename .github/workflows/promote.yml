name: Promote Release Candidate

on:
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Immutable RC tag to promote.
        required: true
        type: string
      stable_version:
        description: Stable semantic version without v prefix.
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Download immutable RC assets
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: gh release download "$RC_TAG" --dir promotion
      - name: Verify RC release set and exact asset digests
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          manifest="$(find promotion -name 'release-set-rc.json' -print -quit)"
          test -n "$manifest"
          test "$(jq -r .channel "$manifest")" = rc
          test "$(jq -c .release_targets "$manifest")" = '["windows-x64","macos-x64","macos-arm64"]'
          mapfile -t assets < <(find promotion -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(RCMetaStudio-macos-arm64.zip RCMetaStudio-macos-x64.zip RCMetaStudio-windows-x64.zip SHA256SUMS macos-arm64.cdx.json macos-x64.cdx.json release-set-rc.json windows-x64.cdx.json)
          test "${assets[*]}" = "${expected[*]}"
          (cd promotion && sha256sum --check SHA256SUMS)
          for artifact in promotion/RCMetaStudio-*.zip; do gh attestation verify "$artifact" --repo "${{ github.repository }}"; done
          source_sha="$(jq -r .source.commit "$manifest")"
          git fetch origin "refs/tags/$RC_TAG:refs/tags/$RC_TAG"
          test "$(git rev-list -n 1 "$RC_TAG")" = "$source_sha"
          python scripts/delivery.py verify --manifest "$manifest"
          python scripts/delivery.py promote --manifest "$manifest" --from-channel rc --channel stable --version "$STABLE_VERSION" --output promotion/release-set-stable.json
      - name: Publish stable release without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE_TAG: v${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then echo "Stable release already exists; refusing overwrite." >&2; exit 1; fi
          source_sha="$(jq -r .source.commit promotion/release-set-stable.json)"
          profile="$(jq -r .trust_profile promotion/release-set-stable.json)"
          if [ "$profile" = unsigned-community ]; then
            title="RC MetaStudio ${{ inputs.stable_version }}"
            notes=$'**Signing status:** Unsigned community builds.\n\nWindows x64, macOS Intel x64, and macOS Apple Silicon artifacts were promoted from ${{ inputs.rc_tag }} without rebuilding or modifying deliverables. Their immutable hashes form the handoff boundary for future signing.'
          else
            title="RC MetaStudio ${{ inputs.stable_version }}"
            notes="Promoted from ${{ inputs.rc_tag }} without rebuilding or modifying deliverables."
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$STABLE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$STABLE_TAG:refs/tags/$STABLE_TAG"
            test "$(git rev-list -n 1 "$STABLE_TAG")" = "$source_sha"
            tag_args=(--verify-tag)
          else
            tag_args=(--target "$source_sha")
          fi
          gh release create "$STABLE_TAG" promotion/RCMetaStudio-*.zip promotion/*.cdx.json promotion/SHA256SUMS promotion/release-set-stable.json "${tag_args[@]}" --title "$title" --notes "$notes"
      - name: Prove promotion preserved artifact bytes
        run: (cd promotion && sha256sum --check SHA256SUMS)
