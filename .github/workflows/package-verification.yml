name: Manual Package Qualification

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Qualify the Windows x64 package without publishing it.
        required: true
        default: true
        type: boolean
      build_macos:
        description: Qualify the macOS Intel package without publishing it.
        required: true
        default: true
        type: boolean
      build_macos_arm64:
        description: Qualify the supported Apple Silicon package.
        required: true
        default: false
        type: boolean
      build_macos_direct_r_spike:
        description: Run the non-release direct staged R.framework feasibility path.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-package-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    if: ${{ inputs.build_windows }}
    uses: ./.github/workflows/package-windows.yml

  macos-package-intel:
    if: ${{ inputs.build_macos }}
    uses: ./.github/workflows/package-target.yml
    with:
      artifact_name: RCMetaStudio-macos-x64

  # Apple Silicon qualification is intentionally deferred to Issue #343.

  macos-direct-r-spike:
    if: ${{ inputs.build_macos_direct_r_spike }}
    uses: ./.github/workflows/macos-x64-direct-r-spike.yml
