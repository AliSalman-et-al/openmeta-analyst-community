name: Manual Package Qualification

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Qualify the Windows x64 package without publishing it.
        required: true
        default: true
        type: boolean
      build_macos:
        description: Qualify the macOS Intel package without publishing it.
        required: true
        default: true
        type: boolean
      build_macos_arm64:
        description: Attempt the unsupported experimental Apple Silicon package.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-package-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    if: ${{ inputs.build_windows }}
    uses: ./.github/workflows/package-target.yml
    with:
      runner: windows-latest
      target_os: windows
      artifact_name: RCMetaStudio-windows-x64
      archive_platform: windows-x64

  macos-package-intel:
    if: ${{ inputs.build_macos }}
    uses: ./.github/workflows/package-target.yml
    with:
      runner: macos-15-intel
      target_os: macos
      artifact_name: RCMetaStudio-macos-x64
      archive_platform: macos-x64

  macos-package-arm64:
    if: ${{ inputs.build_macos_arm64 }}
    runs-on: macos-14
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv python install 3.11.9
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: 4.6.1
          use-public-rspm: true
      - run: bash scripts/package-macos.sh --architecture arm64 --artifact-name RCMetaStudio-macos-arm64 --r-runtime-root "$(R RHOME)"
