name: Manual Package Qualification

on:
  workflow_dispatch:
    inputs:
      build_windows:
        description: Qualify the Windows x64 package without publishing it.
        required: true
        default: true
        type: boolean
      build_macos:
        description: Qualify the macOS Intel package without publishing it.
        required: true
        default: true
        type: boolean
      build_macos_arm64:
        description: Qualify the supported Apple Silicon package.
        required: true
        default: false
        type: boolean
      build_macos_direct_r_spike:
        description: Run the non-release direct staged R.framework feasibility path.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: manual-package-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    if: ${{ inputs.build_windows }}
    uses: ./.github/workflows/package-target.yml
    with:
      runner: windows-latest
      target_os: windows
      artifact_name: RCMetaStudio-windows-x64
      archive_platform: windows-x64

  macos-package-intel:
    if: ${{ inputs.build_macos }}
    uses: ./.github/workflows/package-target.yml
    with:
      runner: macos-15-intel
      target_os: macos
      artifact_name: RCMetaStudio-macos-x64
      archive_platform: macos-x64

  macos-package-arm64:
    if: ${{ inputs.build_macos_arm64 }}
    uses: ./.github/workflows/package-target.yml
    with:
      runner: macos-15
      target_os: macos
      artifact_name: RCMetaStudio-macos-arm64
      archive_platform: macos-arm64
      macos_architecture: arm64

  macos-direct-r-spike:
    if: ${{ inputs.build_macos_direct_r_spike }}
    uses: ./.github/workflows/macos-x64-direct-r-spike.yml
