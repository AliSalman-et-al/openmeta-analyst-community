name: Modern Fast Verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: modern-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-verification:
    name: Fast Verification Lane
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Set up R for Default R Evidence
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release

      - name: Run Fast Verification Lane
        run: .\scripts\verify-modern-fast.ps1

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci
