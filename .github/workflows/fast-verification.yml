name: Qt6 Integration Verification

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  RCMS_CRAN_REPO: https://packagemanager.posit.co/cran/2026-07-16

concurrency:
  group: fast-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-classifier:
    name: Qt6 Verification Change Classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-windows: ${{ steps.classify.outputs.run-windows }}
      run-windows-package: ${{ steps.classify.outputs.run-windows-package }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - name: Check out classifier policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run-windows=true" >> "$GITHUB_OUTPUT"
            echo "run-windows-package=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            echo "run-windows=true" >> "$GITHUB_OUTPUT"
            echo "run-windows-package=true" >> "$GITHUB_OUTPUT"
            echo "reason=push to ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          run_windows=false
          reason="no Qt6 integration verification inputs changed"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*|.python-version|pyproject.toml|uv.lock|config/*|r/*|scripts/*|src/*|tests/*)
                run_windows=true
                reason="matched $file"
                break
                ;;
            esac
          done <<< "$changed_files"

          package_required="$(printf '%s\n' "$changed_files" | python3 scripts/package_input_policy.py)"
          if [ "$package_required" = "true" ] && [ "$run_windows" != "true" ]; then
            reason="matched a release-package qualification input"
          fi

          echo "run-windows=$run_windows" >> "$GITHUB_OUTPUT"
          echo "run-windows-package=$package_required" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "$reason"

  qt6-verification:
    name: Native Qt6 Vertical Slice
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11.9

      - name: Cache official Qt rcc package
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build\qt-rcc
          key: qt-rcc-6.11.1-windows-x64-7f97edc3937fec7383eb865e010ed5128155bf9c80a563abca450860f3e9bef5

      - name: Run Native Qt6 Vertical Slice
        run: .\scripts\verify-qt6.ps1 -Sync -Section Core

      - name: Upload native calculator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-calculator-evidence
          path: build/qt6-verification/native-calculators
          if-no-files-found: warn
          retention-days: 14

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  remaining-surface-verification:
    name: Native Qt6 Remaining Surfaces
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11.9

      - name: Run remaining-surface verification on a fresh runner
        run: .\scripts\verify-qt6.ps1 -Sync -Section RemainingSurfaces

      - name: Upload native remaining-surface evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-remaining-surface-evidence
          path: build/qt6-verification/native-remaining-surfaces
          if-no-files-found: error
          retention-days: 14

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  source-fast-targets:
    name: Source and Platform Verification (${{ matrix.target }})
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows == 'true' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            platform: windows
          - target: macos-arm64
            runner: macos-15
            platform: macos
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked Python
        run: uv python install 3.11.9

      - name: Install pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: 4.6.1
          use-public-rspm: true

      - name: Cache Default R Evidence library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/r-default-library-cache
          key: r-default-evidence-v2-${{ matrix.target }}-r-4.6.1-public-ppm-2026-07-16-${{ hashFiles('scripts/install-r-deps.R', 'scripts/r_binary_policy.R', 'scripts/r_dependency_policy.py', 'scripts/r_verification_support.py', 'scripts/verify_rcmetar_r_default.py', 'config/r-dependencies.json', 'r/RCMetaR/DESCRIPTION') }}

      - name: Provision macOS native R build libraries
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          brew install libpng pkg-config
          libpng_prefix="$(brew --prefix libpng)"
          mkdir -p "$HOME/.R"
          printf 'CPPFLAGS += -I%s/include\nLDFLAGS += -L%s/lib\n' \
            "$libpng_prefix" "$libpng_prefix" >> "$HOME/.R/Makevars"
          echo "CPPFLAGS=-I$libpng_prefix/include ${CPPFLAGS:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$libpng_prefix/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$libpng_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Rebuild and prove macOS rpy2 API bridge against installed R
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          export R_HOME="$(R RHOME)"
          export RPY2_CFFI_MODE=API
          echo "R_HOME=$R_HOME" >> "$GITHUB_ENV"
          echo "RPY2_CFFI_MODE=API" >> "$GITHUB_ENV"
          uv sync --locked --reinstall-package rpy2-rinterface \
            --no-binary-package rpy2-rinterface
          bridge="$(uv run python -c 'from pathlib import Path; import _rinterface_cffi_api as module; print(Path(module.__file__).resolve())')"
          test "$(uv run python -c 'from importlib import metadata; print(metadata.version("rpy2-rinterface"))')" = "3.6.6"
          test "$(lipo -archs "$bridge")" = "$(uname -m)"
          test "$(otool -L "$bridge" | awk 'NR > 1 && ($1 ~ /libR[.]dylib$/ || $1 ~ /\/R$/) { count++ } END { print count + 0 }')" = "1"
          uv run python - <<'PY'
          from rpy2 import robjects
          from rpy2.rinterface_lib import openrlib

          if openrlib.cffi_mode.name != "API":
              raise SystemExit(f"rpy2 loaded {openrlib.cffi_mode.name}, expected API")
          result = float(robjects.r("sum(c(1.25, 2.5, 3.75))")[0])
          if result != 7.5:
              raise SystemExit(f"embedded R calculation returned {result}, expected 7.5")
          PY

      - name: Cache official Qt rcc package on Windows
        if: ${{ matrix.platform == 'windows' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build\qt-rcc
          key: qt-rcc-6.11.1-windows-x64-7f97edc3937fec7383eb865e010ed5128155bf9c80a563abca450860f3e9bef5

      - name: Cache official Qt SDK on macOS
        if: ${{ matrix.platform == 'macos' }}
        id: macos_qt_sdk_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/qt-sdk
          key: qt-sdk-6.11.1-${{ matrix.target }}

      - name: Install official Qt SDK on macOS
        if: ${{ matrix.platform == 'macos' && steps.macos_qt_sdk_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: uv run aqt install-qt mac desktop 6.11.1 clang_64 --outputdir "$PWD/build/qt-sdk"

      - name: Resolve official Qt rcc on macOS
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/qt6_macos_feasibility.py resolve-rcc \
            --sdk-root "$PWD/build/qt-sdk/6.11.1/macos" \
            --github-env "$GITHUB_ENV" \
            --diagnostic "build/qt-sdk/${{ matrix.target }}-rcc.json"

      # Platform-neutral Python and golden contracts run once. The macOS jobs
      # own native Qt generation, the compiled rpy2 bridge, a representative
      # application smoke slice, and real Default R evidence on each host ISA.
      - name: Run Platform-Neutral Python Verification
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: uv run --locked python scripts\verify.py fast --skip-r-evidence

      - name: Run Native Platform Smoke and R Evidence
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: uv run --no-sync python scripts/verify.py smoke --require-r-evidence

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  full-r-stack:
    name: Required Windows Full R Stack Evidence
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11.9

      - name: Install pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: 4.6.1
          use-public-rspm: true

      - name: Cache Full R Stack library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/r-library-cache
          key: r-full-stack-v1-windows-r-4.6.1-public-ppm-2026-07-16-${{ hashFiles('scripts/install-r-deps.R', 'scripts/r_binary_policy.R', 'scripts/r_dependency_policy.py', 'scripts/r_verification_support.py', 'config/r-dependencies.json', 'r/RCMetaR/DESCRIPTION', 'scripts/verify_rcmetar_r_stack.py') }}

      - name: Run Full R Stack Evidence
        run: uv run --locked python scripts\verify.py r-stack

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  windows-package-qualification:
    name: Required Windows x64 Package Qualification
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows-package == 'true' }}
    uses: ./.github/workflows/package-windows.yml

  packaging-contract:
    name: Packaging Contract Tests
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows-package == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11.9

      - name: Prepare generated Qt6 forms
        run: |
          uv sync --locked
          $buildRoot = Join-Path $PWD "build\qt6-packaging-contract"
          uv run python scripts\build_qt6.py generate --build-root $buildRoot
          if ($LASTEXITCODE -ne 0) { throw "Qt6 form or resource generation failed." }
          "RCMS_QT6_BUILD_ROOT=$((Resolve-Path $buildRoot).Path)" >> $env:GITHUB_ENV

      - name: Run packaging contract tests
        run: uv run pytest -q tests\packaging\contract

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  packaging-contract-macos:
    name: Focused Native macOS Packaging Contracts
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows-package == 'true' }}
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11.9

      - name: Install locked project dependencies
        run: uv sync --locked

      - name: Run focused native macOS packaging contract nodes
        run: |
          uv run pytest -q \
            tests/packaging/contract/test_macos_embedded_r_adapter_behavior.py::test_pyinstaller_preserves_miniature_cran_framework_toc \
            tests/packaging/contract/test_macos_native_pipeline_contract.py

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  fast-verification-gate:
    name: Qt6 Integration Verification Gate
    needs:
      - change-classifier
      - qt6-verification
      - remaining-surface-verification
      - source-fast-targets
      - full-r-stack
      - windows-package-qualification
      - packaging-contract
      - packaging-contract-macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required lane results
        shell: bash
        env:
          CLASSIFIER_RESULT: ${{ needs.change-classifier.result }}
          RUN_WINDOWS: ${{ needs.change-classifier.outputs.run-windows }}
          REASON: ${{ needs.change-classifier.outputs.reason }}
          QT6_RESULT: ${{ needs.qt6-verification.result }}
          REMAINING_SURFACE_RESULT: ${{ needs.remaining-surface-verification.result }}
          SOURCE_FAST_RESULT: ${{ needs.source-fast-targets.result }}
          FULL_R_STACK_RESULT: ${{ needs.full-r-stack.result }}
          RUN_WINDOWS_PACKAGE: ${{ needs.change-classifier.outputs.run-windows-package }}
          WINDOWS_PACKAGE_RESULT: ${{ needs.windows-package-qualification.result }}
          PACKAGING_CONTRACT_RESULT: ${{ needs.packaging-contract.result }}
          PACKAGING_CONTRACT_MACOS_RESULT: ${{ needs.packaging-contract-macos.result }}
        run: |
          set -euo pipefail
          if [ "$CLASSIFIER_RESULT" != "success" ]; then
            echo "Qt6 verification change classifier result: $CLASSIFIER_RESULT" >&2
            exit 1
          fi
          echo "Qt6 integration verification classifier: $REASON"
          if [ "$RUN_WINDOWS" != "true" ]; then
            echo "No Qt6 verification inputs changed; Windows lane intentionally skipped."
          else
            if [ "$QT6_RESULT" != "success" ]; then
              echo "Native Qt6 Vertical Slice result: $QT6_RESULT" >&2
              exit 1
            fi
            if [ "$REMAINING_SURFACE_RESULT" != "success" ]; then
              echo "Native Qt6 Remaining Surfaces result: $REMAINING_SURFACE_RESULT" >&2
              exit 1
            fi
            if [ "$SOURCE_FAST_RESULT" != "success" ]; then
              echo "Three-target Fast Verification result: $SOURCE_FAST_RESULT" >&2
              exit 1
            fi
            if [ "$FULL_R_STACK_RESULT" != "success" ]; then
              echo "Required Windows Full R Stack Evidence result: $FULL_R_STACK_RESULT" >&2
              exit 1
            fi
          fi
          if [ "$RUN_WINDOWS_PACKAGE" = "true" ] && [ "$WINDOWS_PACKAGE_RESULT" != "success" ]; then
            echo "Required Windows x64 package qualification result: $WINDOWS_PACKAGE_RESULT" >&2
            exit 1
          fi
          if [ "$RUN_WINDOWS_PACKAGE" = "true" ] && [ "$PACKAGING_CONTRACT_RESULT" != "success" ]; then
            echo "Windows packaging contract result: $PACKAGING_CONTRACT_RESULT" >&2
            exit 1
          fi
          if [ "$RUN_WINDOWS_PACKAGE" = "true" ] && [ "$PACKAGING_CONTRACT_MACOS_RESULT" != "success" ]; then
            echo "Focused native macOS packaging contract result: $PACKAGING_CONTRACT_MACOS_RESULT" >&2
            exit 1
          fi
          echo "Required classified Qt6 verification passed."

