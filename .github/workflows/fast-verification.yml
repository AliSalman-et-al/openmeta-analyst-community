name: Qt6 Integration Verification

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  pull-requests: read

env:
  RCMS_CRAN_REPO: https://packagemanager.posit.co/cran/2026-07-16

concurrency:
  group: fast-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  change-classifier:
    name: Qt6 Verification Change Classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-windows: ${{ steps.classify.outputs.run-windows }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - name: Classify changed paths
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run-windows=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "push" ]; then
            echo "run-windows=true" >> "$GITHUB_OUTPUT"
            echo "reason=push to ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          run_windows=false
          reason="no Qt6 integration verification inputs changed"
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*|.python-version|pyproject.toml|uv.lock|config/*|docs/verification/*|r/*|scripts/*|src/*|tests/*)
                run_windows=true
                reason="matched $file"
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "run-windows=$run_windows" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "$reason"

  qt6-verification:
    name: Native Qt6 Vertical Slice
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11.9

      - name: Cache official Qt rcc package
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build\qt-rcc
          key: qt-rcc-6.11.1-windows-x64-7f97edc3937fec7383eb865e010ed5128155bf9c80a563abca450860f3e9bef5

      - name: Run Native Qt6 Vertical Slice
        run: .\scripts\verify-qt6.ps1 -Sync

      - name: Upload native calculator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-calculator-evidence
          path: build/qt6-verification/native-calculators
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native remaining-surface evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-remaining-surface-evidence
          path: build/qt6-verification/native-remaining-surfaces
          if-no-files-found: warn
          retention-days: 14

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  source-fast-targets:
    name: Source Smoke and Fast Verification (${{ matrix.target }})
    needs: change-classifier
    if: ${{ needs.change-classifier.outputs.run-windows == 'true' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-latest
            platform: windows
          - target: macos-x64
            runner: macos-15-intel
            platform: macos
          - target: macos-arm64
            runner: macos-15
            platform: macos
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install locked Python
        run: uv python install 3.11.9

      - name: Install pinned R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: 4.6.1
          use-public-rspm: true

      - name: Cache Default R Evidence library
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: artifacts/r-default-library-cache
          key: r-default-evidence-v2-${{ matrix.target }}-r-4.6.1-public-ppm-2026-07-16-${{ hashFiles('scripts/install-r-deps.R', 'scripts/r_binary_policy.R', 'scripts/r_dependency_policy.py', 'docs/verification/RCMetaR-r-dependencies.json', 'r/RCMetaR/DESCRIPTION') }}

      - name: Provision macOS native R build libraries
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          brew install libpng pkg-config
          libpng_prefix="$(brew --prefix libpng)"
          mkdir -p "$HOME/.R"
          printf 'CPPFLAGS += -I%s/include\nLDFLAGS += -L%s/lib\n' \
            "$libpng_prefix" "$libpng_prefix" >> "$HOME/.R/Makevars"
          echo "CPPFLAGS=-I$libpng_prefix/include ${CPPFLAGS:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$libpng_prefix/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$libpng_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Provision Default R Evidence on Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          uv sync --locked
          $rscript = (Get-Command Rscript).Source
          uv run python scripts\verify_rcmetar_r_default.py --rscript $rscript --require-r --require-installed-packages --install-missing --r-library-cache-root artifacts\r-default-library-cache

      - name: Provision Default R Evidence on macOS
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked
          uv run python scripts/verify_rcmetar_r_default.py --rscript "$(command -v Rscript)" --require-r --require-installed-packages --install-missing --r-library-cache-root artifacts/r-default-library-cache

      - name: Cache official Qt rcc package on Windows
        if: ${{ matrix.platform == 'windows' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build\qt-rcc
          key: qt-rcc-6.11.1-windows-x64-7f97edc3937fec7383eb865e010ed5128155bf9c80a563abca450860f3e9bef5

      - name: Cache official Qt SDK on macOS
        if: ${{ matrix.platform == 'macos' }}
        id: macos_qt_sdk_cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: build/qt-sdk
          key: qt-sdk-6.11.1-${{ matrix.target }}

      - name: Install official Qt SDK on macOS
        if: ${{ matrix.platform == 'macos' && steps.macos_qt_sdk_cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: uv run aqt install-qt mac desktop 6.11.1 clang_64 --outputdir "$PWD/build/qt-sdk"

      - name: Resolve official Qt rcc on macOS
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/qt6_macos_feasibility.py resolve-rcc \
            --sdk-root "$PWD/build/qt-sdk/6.11.1/macos" \
            --github-env "$GITHUB_ENV" \
            --diagnostic "build/qt-sdk/${{ matrix.target }}-rcc.json"

      - name: Run source smoke and Fast Verification on Windows
        if: ${{ matrix.platform == 'windows' }}
        shell: powershell
        run: |
          .\scripts\verify-smoke.ps1 -Sync -RequireREvidence
          .\scripts\verify-fast.ps1 -StrictTaxonomy -RequireREvidence

      - name: Run source smoke and Fast Verification on macOS
        if: ${{ matrix.platform == 'macos' }}
        shell: bash
        run: |
          bash ./scripts/verify-smoke.sh --sync --require-r-evidence
          bash ./scripts/verify-fast.sh --strict-taxonomy --require-r-evidence

      - name: Prune uv cache
        if: ${{ always() }}
        run: uv cache prune --ci

  fast-verification-gate:
    name: Qt6 Integration Verification Gate
    needs:
      - change-classifier
      - qt6-verification
      - source-fast-targets
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check required lane results
        shell: bash
        env:
          RUN_WINDOWS: ${{ needs.change-classifier.outputs.run-windows }}
          REASON: ${{ needs.change-classifier.outputs.reason }}
          QT6_RESULT: ${{ needs.qt6-verification.result }}
          SOURCE_FAST_RESULT: ${{ needs.source-fast-targets.result }}
        run: |
          set -euo pipefail
          echo "Qt6 integration verification classifier: $REASON"
          if [ "$RUN_WINDOWS" != "true" ]; then
            echo "No Qt6 verification inputs changed; Windows lane intentionally skipped."
            exit 0
          fi
          if [ "$QT6_RESULT" != "success" ]; then
            echo "Native Qt6 Vertical Slice result: $QT6_RESULT" >&2
            exit 1
          fi
          if [ "$SOURCE_FAST_RESULT" != "success" ]; then
            echo "Three-target source smoke and Fast Verification result: $SOURCE_FAST_RESULT" >&2
            exit 1
          fi
          echo "Native Qt6 vertical-slice verification passed."
