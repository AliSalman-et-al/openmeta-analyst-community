[project]
name = "rc-metastudio"
version = "0.1.0"
description = "RC MetaStudio open-source desktop software for advanced meta-analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Ali Salman and RC MetaStudio contributors", email = "alisalman.et.al@gmail.com" },
]
maintainers = [
    { name = "Ali Salman", email = "alisalman.et.al@gmail.com" },
]
dependencies = [
    "PyQt5==5.15.11",
    "PyQt5-Qt5==5.15.2",
    "pyinstaller==6.21.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "rpy2==3.6.7",
]

[project.scripts]
rc-metastudio = "rc_metastudio.__main__:main"

[project.urls]
Homepage = "https://github.com/AliSalman-et-al/rc-metastudio"
Issues = "https://github.com/AliSalman-et-al/rc-metastudio/issues"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rc_metastudio*"]

[tool.setuptools.package-data]
rc_metastudio = [
    "forms/*.ui",
    "images/**/*",
]

[tool.pytest.ini_options]
markers = [
    "fast: default fast verification lane tests.",
    "gui: offscreen Qt or MetaForm GUI workflow tests.",
    "r_stack: tests that require or simulate R Stack behavior.",
    "golden: golden baseline tooling and comparison tests.",
    "packaging_contract: packaging and workflow contract tests.",
    "packaged_smoke: tests that execute packaged application smoke checks.",
    "slow: tests that are too costly for the default fast lane.",
    "small: no Qt window, no R subprocess/rpy2, no packaging, fast and hermetic.",
    "medium: Qt offscreen/model/dialog integration, subprocess helpers, or file fixtures.",
    "large: real MetaForm workflows, real R/rpy2, or packaged application behavior.",
    "analysis_behavior: evidence for preserved statistical analysis behavior.",
    "gui_compatibility: evidence for GUI compatibility or workflow preservation.",
    "release_readiness: evidence for release, packaging, or cutover readiness.",
]
