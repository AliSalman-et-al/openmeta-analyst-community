[project]
name = "rc-metastudio"
version = "0.3.0"
description = "RC MetaStudio open-source desktop software for advanced meta-analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [
    { name = "Ali Salman and RC MetaStudio contributors", email = "alisalman.et.al@gmail.com" },
]
maintainers = [
    { name = "Ali Salman", email = "alisalman.et.al@gmail.com" },
]
dependencies = [
    "PyQt6==6.11.0",
    "jsonschema==4.25.1",
    "pyinstaller==6.21.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "rpy2==3.6.7",
]

[project.scripts]
rc-metastudio = "rc_metastudio.__main__:main"

[project.urls]
Homepage = "https://github.com/AliSalman-et-al/rc-metastudio"
Issues = "https://github.com/AliSalman-et-al/rc-metastudio/issues"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rc_metastudio*"]

[tool.setuptools.package-data]
rc_metastudio = [
    "forms/*.ui",
    "images/**/*",
    "project_schemas/**/*.json",
]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "qsettings: tests that require isolated per-test QSettings storage.",
]

[dependency-groups]
dev = [
    "aqtinstall==3.3.0",
    "libcst==1.8.6",
    "matplotlib>=3.11.0",
    "pillow>=12.3.0",
    "py7zr==1.1.3",
    "pyyaml==6.0.3",
    "ty==0.0.18",
]

[tool.ty.environment]
python-version = "3.11"
root = ["./src", "."]

[tool.ty.src]
exclude = ["build", "src/rc_metastudio/forms/ui_*.py"]

[tool.ty.rules]
all = "error"
